# GitLab CI/CD Pipeline for k8s-sidecar
# 支持多架构 Docker 镜像构建和推送

stages:
  - lint
  - test
  - build
  - publish

# 全局变量
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  BUILD_PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7"
  GO_VERSION: "1.25"
  # Go 模块缓存
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.go/cache"

# 缓存配置
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .go/pkg/mod/
    - .go/cache/

# ==================== Lint 阶段 ====================
lint:
  stage: lint
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - go version
  script:
    - echo "Running code quality checks..."
    - go fmt ./...
    - go vet ./...
    - |
      if ! command -v golangci-lint &> /dev/null; then
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
      fi
    - golangci-lint run --timeout=5m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ==================== Test 阶段 ====================
test:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git make
    - go version
  script:
    - echo "Running unit tests..."
    - make test
    - |
      echo "Test coverage report:"
      go tool cover -func=coverage.out | tail -1
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.out
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ==================== Build 阶段 ====================
build-multiarch:
  stage: build
  image: docker:24-dind
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl qemu-user-static
    - docker info
    - |
      # 初始化 Buildx
      docker buildx create --name multiarch-builder --use || true
      docker buildx inspect --bootstrap
    - |
      # 注册 QEMU 用于跨平台模拟
      docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
  script:
    - |
      echo "Building multi-architecture images..."
      echo "Platforms: ${BUILD_PLATFORMS}"
      echo "Version: ${CI_COMMIT_TAG:-latest}"
      
      # 确定镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG}"
      else
        IMAGE_TAG="latest"
      fi
      
      # 构建多架构镜像（不推送，仅测试）
      docker buildx build \
        --platform ${BUILD_PLATFORMS} \
        --build-arg VERSION=${IMAGE_TAG} \
        --tag ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}-build \
        --load \
        .
    
    - echo "Build completed successfully"
    - docker buildx ls
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  timeout: 30m

# ==================== Publish 阶段 ====================
publish:
  stage: publish
  image: docker:24-dind
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl qemu-user-static
    - docker info
    - |
      # 初始化 Buildx
      docker buildx create --name multiarch-builder --use || true
      docker buildx inspect --bootstrap
    - |
      # 注册 QEMU
      docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    - |
      # 登录 GitLab Container Registry
      echo "Logging in to GitLab Registry..."
      echo "${CI_REGISTRY_PASSWORD}" | docker login ${CI_REGISTRY} -u "${CI_REGISTRY_USER}" --password-stdin
  script:
    - |
      echo "Publishing multi-architecture images..."
      
      # 确定镜像标签
      TAGS=""
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
        # 如果是稳定版本，也打上 latest 标签
        if echo "${CI_COMMIT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          TAGS="${TAGS},${CI_REGISTRY_IMAGE}:latest"
        fi
      else
        TAGS="${CI_REGISTRY_IMAGE}:latest"
      fi
      
      echo "Tags: ${TAGS}"
      
      # 构建并推送多架构镜像
      IFS=',' read -ra TAG_ARRAY <<< "${TAGS}"
      for tag in "${TAG_ARRAY[@]}"; do
        echo "Building and pushing: ${tag}"
        docker buildx build \
          --platform ${BUILD_PLATFORMS} \
          --build-arg VERSION=$(echo ${tag} | rev | cut -d: -f1 | rev) \
          --tag ${tag} \
          --push \
          --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache \
          --cache-to type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache,mode=max \
          .
      done
    
    - echo "✅ Successfully published images to ${CI_REGISTRY_IMAGE}"
    - |
      echo "Published tags:"
      for tag in "${TAG_ARRAY[@]}"; do
        echo "  - ${tag}"
      done
  after_script:
    - docker logout ${CI_REGISTRY}
    - docker buildx rm multiarch-builder || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  timeout: 45m
  needs:
    - job: lint
    - job: test
    - job: build-multiarch
      optional: true

# ==================== 可选：清理旧镜像 ====================
cleanup:
  stage: publish
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Cleaning up old images (optional)..."
      # 这里可以添加清理逻辑，例如删除超过30天的开发版本
      echo "Cleanup logic can be added here"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  allow_failure: true