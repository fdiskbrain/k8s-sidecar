# GitLab CI/CD Pipeline for k8s-sidecar
# 支持多架构 Docker 镜像构建和推送

stages:
  - test
  - build
  - publish

# 全局变量
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  GO_VERSION: "1.25"
  
  # Go 模块缓存
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  
  # Go 代理加速（中国镜像）
  GOPROXY: "https://goproxy.cn,https://mirrors.aliyun.com/goproxy/,direct"
  # GONOSUMDB: "*"
  # GONOPROXY: "*"
  
  # Docker 镜像加速（中国镜像源）
  DOCKER_BUILDKIT: "1"
  # Alpine APK 镜像源
  ALPINE_MIRROR: "mirrors.aliyun.com"

# 缓存配置
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .go/pkg/mod/
    - .go/cache/

# ==================== Lint 阶段 ====================
lint:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    # 配置 Alpine APK 国内镜像源
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache git curl golangci-lint
    - go version
    - echo "GOPROXY=$GOPROXY"
    # 确保 GOPATH/bin 目录存在
    - mkdir -p $(go env GOPATH)/bin
    - export PATH=$(go env GOPATH)/bin:$PATH
  script:
    - echo "Running code quality checks..."
    - go fmt ./...
    - go vet ./...
    - |
      if ! command -v golangci-lint &> /dev/null; then
        echo "Installing golangci-lint..."
        export GOLANGCI_LINT_VERSION="v1.55.2"
        # 尝试从 GitHub releases 下载（使用代理）
        if curl -sSfL -o /tmp/golangci-lint.tar.gz https://goproxy.cn/github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz; then
          tar xzf /tmp/golangci-lint.tar.gz -C /tmp
          mv /tmp/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint $(go env GOPATH)/bin/golangci-lint
          chmod +x $(go env GOPATH)/bin/golangci-lint
          rm -rf /tmp/golangci-lint.tar.gz /tmp/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64
        else
          # 降级到官方安装脚本
          echo "Falling back to official install script..."
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin ${GOLANGCI_LINT_VERSION}
        fi
      fi
    - golangci-lint version
    - golangci-lint run --timeout=5m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ==================== Test 阶段 ====================
test:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    # 配置 Alpine APK 国内镜像源
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache git make gcc musl-dev
    - go version
    - echo "GOPROXY=$GOPROXY"
  script:
    - echo "Running unit tests with race detection..."
    - make test
    - |
      echo "Test coverage report:"
      go tool cover -func=coverage.out | tail -1
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.out
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ==================== Build 阶段 ====================
build-multiarch:
  stage: build
  image:
    name: docker:29-cli
  services:
    - name: docker:29-dind
      command: ["--registry-mirror", "https://docker.m.daocloud.io"]
  # variables:
  #   DOCKER_HOST: tcp://docker:2375
  #   DOCKER_TLS_CERTDIR: ""
  before_script:
    # 配置 Alpine APK 国内镜像源
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache curl # qemu-user-static
    - docker info
    - |
      # 初始化 Buildx
      docker buildx create --name multiarch-builder  --platform  "linux/amd64,linux/arm64,linux/arm" --use || true
      docker buildx inspect --bootstrap
    # - |
    #   # 注册 QEMU 用于跨平台模拟（使用国内镜像）
    #   docker pull registry.cn-hangzhou.aliyuncs.com/hoxfs/qemu-user-static:latest || \
    #   docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
  script:
    - |
      echo "Building multi-architecture images..."
      echo "Platforms: ${BUILD_PLATFORMS}"
      echo "Version: ${CI_COMMIT_TAG:-latest}"
      
      # 确定镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG}"
      else
        IMAGE_TAG="latest"
      fi
      
      # 注意：docker exporter (--load) 不支持多平台 manifest lists
      # 因此这里只构建当前架构用于测试验证
      echo "Note: Building single architecture for build verification (multi-arch push happens in publish stage)"
      
      docker buildx build \
        --platform linux/arm64 \
        --build-arg VERSION=${IMAGE_TAG} \
        --tag ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}-build \
        --load \
        .
    
    - echo "Build completed successfully"
    - docker buildx ls
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  timeout: 30m

# ==================== Publish 阶段 ====================
publish:
  stage: publish
  image:
    name: docker:29-cli
  services:
    - name: docker:29-dind
      command: ["--registry-mirror", "https://docker.m.daocloud.io"]
  # variables:
  #   DOCKER_HOST: tcp://docker:2375
  #   DOCKER_TLS_CERTDIR: ""
  before_script:
    # 配置 Alpine APK 国内镜像源
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache curl bash # qemu-user-static
    - docker info
    - |
      # 初始化 Buildx
      docker buildx create --name multiarch-builder --platform "linux/amd64,linux/arm64,linux/arm" --use || true
      docker buildx inspect --bootstrap
    - |
      # 登录 GitLab Container Registry
      echo "Logging in to GitLab Registry..."
      echo "${CI_REGISTRY_PASSWORD}" | docker login ${CI_REGISTRY} -u "${CI_REGISTRY_USER}" --password-stdin
  script:
    - |
      echo "Publishing multi-architecture images..."
      set -x
      # 确定镜像标签
      TAGS=""
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
        # 如果是稳定版本，也打上 latest 标签
        if echo "${CI_COMMIT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          TAGS="${TAGS},${CI_REGISTRY_IMAGE}:latest"
        fi
      else
        TAGS="${CI_REGISTRY_IMAGE}:latest"
      fi
      
      echo "Tags: ${TAGS}"
      
      # 构建并推送多架构镜像
      IFS=',' read -ra TAG_ARRAY <<< "${TAGS}"
      for tag in "${TAG_ARRAY[@]}"; do
        echo "Building and pushing: ${tag}"
        docker buildx build \
          --platform ${BUILD_PLATFORMS} \
          --build-arg VERSION=$(echo ${tag} | rev | cut -d: -f1 | rev) \
          --tag ${tag} \
          --push \
          --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache \
          --cache-to type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache,mode=max \
          .
      done
    
    - echo "✅ Successfully published images to ${CI_REGISTRY_IMAGE}"
    - |
      echo "Published tags:"
      for tag in "${TAG_ARRAY[@]}"; do
        echo "  - ${tag}"
      done
  after_script:
    - docker logout ${CI_REGISTRY}
    - docker buildx rm multiarch-builder || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  timeout: 45m
  needs:
    - job: lint
    - job: test
    - job: build-multiarch
      optional: true

# ==================== 可选：清理旧镜像 ====================
cleanup:
  stage: publish
  image: alpine:latest
  before_script:
    # 配置 Alpine APK 国内镜像源
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache curl jq
  script:
    - |
      echo "Cleaning up old images (optional)..."
      # 这里可以添加清理逻辑，例如删除超过30天的开发版本
      echo "Cleanup logic can be added here"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  allow_failure: true