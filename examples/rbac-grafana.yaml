# Grafana Sidecar 专用 RBAC 配置

---
# ServiceAccount for Grafana Sidecar
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sidecar
  namespace: monitoring
  labels:
    app: grafana

---
# Role: 允许读取 ConfigMap（Dashboard 定义）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-dashboard-watcher
  namespace: monitoring
  labels:
    app: grafana
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding: 绑定到 Grafana Sidecar ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-dashboard-watcher-binding
  namespace: monitoring
  labels:
    app: grafana
roleRef:
  kind: Role
  name: grafana-dashboard-watcher
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: grafana-sidecar
  namespace: monitoring

---
